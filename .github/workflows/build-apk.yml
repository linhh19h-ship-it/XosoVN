name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir build-src
          unzip -q XoSoVN_GitHub_Build.zip -d temp
          unzip -q temp/XoSoVN_MienNam_v3_RealData.zip -d build-src

      - name: Build APK
        run: gradle --no-daemon --stacktrace -p build-src :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XoSoVN-APK
          path: build-src/app/build/outputs/apk/debug/*.apk
